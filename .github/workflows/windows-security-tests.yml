name: Windows security storage tests

on:
  pull_request:
    paths:
      - 'src/XboxAuthNet.Game.WindowsSecurity/**'
      - 'src/XboxAuthNet.Game/**'
      - 'tests/XboxAuthNet.Game.WindowsSecurity.Test/**'
      - '.github/workflows/windows-security-tests.yml'
  push:
    branches: [dev, master]
    paths:
      - 'src/XboxAuthNet.Game.WindowsSecurity/**'
      - 'src/XboxAuthNet.Game/**'
      - 'tests/XboxAuthNet.Game.WindowsSecurity.Test/**'
      - '.github/workflows/windows-security-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/XboxAuthNet.Game.WindowsSecurity.Test/XboxAuthNet.Game.WindowsSecurity.Test.csproj --configuration Release
